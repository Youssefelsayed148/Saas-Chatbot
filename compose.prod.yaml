# Production stack for a single VPS. See DEPLOY.md.
#
#   cp .env.production.example .env.production   # fill in every value
#   ./scripts/deploy.sh                          # build, migrate, start, verify
#
# Only Caddy (80/443) is published. Postgres, the API, the worker and the web
# server live on the private compose network. Secrets come from .env.production
# (never committed) and are not baked into any image.
name: saas-chats-ai

x-api-image: &api-image
  image: saas-chats-ai-api:${RELEASE:-local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
  restart: unless-stopped

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  ENVIRONMENT: production

x-app-environment: &app-environment
  <<: *database-environment
  STORAGE_ROOT: /data/storage
  COOKIE_SECURE: "true"
  CHANNEL_SECRET_ENCRYPTION_KEYS: ${CHANNEL_SECRET_ENCRYPTION_KEYS:?Set CHANNEL_SECRET_ENCRYPTION_KEYS in .env.production}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  CHAT_OPENAI_API_KEY: ${CHAT_OPENAI_API_KEY:?Set CHAT_OPENAI_API_KEY in .env.production}
  CHAT_OPENAI_MODEL: ${CHAT_OPENAI_MODEL:-gpt-5.4-nano}
  CHAT_OPENAI_FALLBACK_MODELS: ${CHAT_OPENAI_FALLBACK_MODELS:-[]}
  CHAT_OPENROUTER_API_KEY: ${CHAT_OPENROUTER_API_KEY:-}
  CHAT_FREE_MODEL_CHAIN: ${CHAT_FREE_MODEL_CHAIN:-[]}
  RETRIEVAL_MIN_FTS_MATCH: ${RETRIEVAL_MIN_FTS_MATCH:-0.01}
  RETRIEVAL_MIN_MATCHED_TERMS: ${RETRIEVAL_MIN_MATCHED_TERMS:-2}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    logging: *logging
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy

  # One-shot: creates/updates the platform-admin account. Skips when no password is set.
  staff:
    <<: *api-image
    logging: *logging
    command:
      - sh
      - -c
      - |
        if [ -n "$$PLATFORM_STAFF_PASSWORD" ]; then
          python -m scripts.create_platform_staff
        else
          echo "PLATFORM_STAFF_PASSWORD not set; skipping staff bootstrap."
        fi
    restart: "no"
    environment:
      <<: *database-environment
      STORAGE_ROOT: /data/storage
      PLATFORM_STAFF_EMAIL: ${PLATFORM_STAFF_EMAIL:-}
      PLATFORM_STAFF_PASSWORD: ${PLATFORM_STAFF_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-image
    logging: *logging
    environment: *app-environment
    volumes:
      - app_data:/data
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 30s

  worker:
    <<: *api-image
    logging: *logging
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    volumes:
      - app_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; path='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(path) and time.time()-os.path.getmtime(path) < 30 else 1)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5

  web:
    image: saas-chats-ai-web:${RELEASE:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js bakes the same-origin /api proxy into its build manifest.
        API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    logging: *logging
    environment:
      API_PROXY_TARGET: http://api:8000
      # The staff-console guard calls the API directly with the caller's cookie.
      PLATFORM_GUARD_ORIGIN: http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
      staff:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (the public host name, e.g. chat.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # Daily compressed logical backup of the database plus uploaded files, kept
  # BACKUP_KEEP_DAYS days in ./backups on the host. Copy them off the VPS too.
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - app_data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
