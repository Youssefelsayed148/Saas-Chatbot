name: Foundation validation
# Manual only: run it from the repository Actions tab (Run workflow) when you want a full
# validation on GitHub. It no longer starts on every push or pull request.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chatbot_dev
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: chatbot_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chatbot_dev:ci-only-not-secret@127.0.0.1:55432/chatbot_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Check signed channel contract copies
        working-directory: ${{ github.workspace }}
        run: python scripts/check_contract_copies.py
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The E2E flow boots the real API against this disposable *_test database.
      DATABASE_URL: postgresql://chatbot_dev:ci-only-not-secret@127.0.0.1:55432/chatbot_dev
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chatbot_dev
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: chatbot_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The E2E flow boots the real API and worker with this Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock
      - run: npx playwright install --with-deps chromium
      - run: npm test
