[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "python-multipart==0.0.32",
    # P2 knowledge ingestion (docs/14 §3): parsers need PDF/DOCX/YAML.
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]
