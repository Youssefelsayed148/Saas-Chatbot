name: saas-chats-ai-dev
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /data/storage
    volumes:
      # Uploaded source files are written by the API and parsed by the worker.
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /data/storage
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      # The worker touches the heartbeat file on every loop; fail when stale.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; path='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(path) and time.time()-os.path.getmtime(path) < 30 else 1)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # The dashboard proxy forwards same-origin /api requests to the FastAPI service.
        API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  app_data:
