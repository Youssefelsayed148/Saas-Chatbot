name: saas-chats-ai-dev
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /data/storage
      CHAT_OPENROUTER_API_KEY: ${CHAT_OPENROUTER_API_KEY:-}
      CHAT_FREE_MODEL_CHAIN: ${CHAT_FREE_MODEL_CHAIN:-[]}
      CHAT_OPENAI_API_KEY: ${CHAT_OPENAI_API_KEY:-}
      CHAT_OPENAI_MODEL: ${CHAT_OPENAI_MODEL:-}
      # Offline extractive stub; off unless explicitly enabled (refused in production).
      CHAT_STUB_MODEL: ${CHAT_STUB_MODEL:-false}
    # Only this service migrates (the worker waits for it to be healthy), so there is
    # a single migrator; `alembic upgrade head` is a no-op when already at head.
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    volumes:
      # Uploaded source files are written by the API and parsed by the worker.
      - app_data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 60s
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /data/storage
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      CHAT_OPENROUTER_API_KEY: ${CHAT_OPENROUTER_API_KEY:-}
      CHAT_FREE_MODEL_CHAIN: ${CHAT_FREE_MODEL_CHAIN:-[]}
      CHAT_OPENAI_API_KEY: ${CHAT_OPENAI_API_KEY:-}
      CHAT_OPENAI_MODEL: ${CHAT_OPENAI_MODEL:-}
      CHAT_STUB_MODEL: ${CHAT_STUB_MODEL:-false}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      # Healthy means migrations have been applied.
      api:
        condition: service_healthy
    healthcheck:
      # The worker touches the heartbeat file on every loop; fail when stale.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; path='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(path) and time.time()-os.path.getmtime(path) < 30 else 1)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # The dashboard proxy forwards same-origin /api requests to the FastAPI service.
        API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  # Optional fictional demo tenant: `docker compose --profile seed run --rm seed`.
  # The script refuses any database not named *_dev / *_demo, and is safe to re-run.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "scripts.seed_demo"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /data/storage
      ENVIRONMENT: development
      # Optional; *_dev databases fall back to the script's fake default.
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
    volumes:
      - app_data:/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  app_data:
